# Publishes a release whenever main has a version that has no release yet.
# To ship an update: raise <Version> in desktop/Directory.Build.props and push to main.
# The app (Settings > Updates, or the line on Home) finds the release and updates itself.
name: Release

on:
  push:
    branches: [main]
    paths: ['desktop/**', 'content/**', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version and see if it is already released
        id: v
        run: |
          $v = ([xml](Get-Content desktop/Directory.Build.props)).Project.PropertyGroup.Version
          "version=$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" --repo $env:GITHUB_REPOSITORY *> $null
          $exists = if ($LASTEXITCODE -eq 0) { 'true' } else { 'false' }
          "exists=$exists" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v, already released: $exists"
          $global:LASTEXITCODE = 0

      - uses: actions/setup-dotnet@v4
        if: steps.v.outputs.exists == 'false'
        with:
          dotnet-version: '10.0.x'

      - name: Test
        if: steps.v.outputs.exists == 'false'
        working-directory: desktop
        run: dotnet test --project Nordlys.Tests -c Release

      - name: Build the app
        if: steps.v.outputs.exists == 'false'
        working-directory: desktop
        run: dotnet publish Nordlys.App -c Release -r win-x64 --self-contained true -p:PublishReadyToRun=true -o publish/folder

      - name: Package the update (zip + SHA-256)
        if: steps.v.outputs.exists == 'false'
        run: |
          $v = '${{ steps.v.outputs.version }}'
          $zip = "Nordlys-$v-win-x64.zip"
          Get-ChildItem desktop/publish/folder -Filter *.pdb -Recurse | Remove-Item
          Compress-Archive -Path desktop/publish/folder/* -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Set-Content -NoNewline -Encoding ascii "$zip.sha256"

      - name: Build the installer (for new installs)
        if: steps.v.outputs.exists == 'false'
        run: |
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { choco install nsis -y --no-progress; $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe" }
          & $makensis /V2 "/DVERSION=${{ steps.v.outputs.version }}" desktop/installer/nordlys.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish the release
        if: steps.v.outputs.exists == 'false'
        run: |
          $v = '${{ steps.v.outputs.version }}'
          gh release create "v$v" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Nordlys $v" --generate-notes `
            "Nordlys-$v-win-x64.zip" "Nordlys-$v-win-x64.zip.sha256" "desktop/publish/Nordlys-$v-setup.exe"
